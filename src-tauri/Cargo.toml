[package]
name = "gsp-scraper"
version = "0.1.0"
edition = "2024"

[lib]
name = "gsp_scraper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
base64 = "0.22"
zeroize = "1"
secrecy = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Security_Cryptography",
  "Win32_Foundation",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
